name: Build CV & Release

on:
  push:
    branches: [master]
    tags: ["v*"]
  pull_request:
    branches: [master]
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    name: Compile PDF
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up TeX Live
        uses: TeX-Live/setup-texlive-action@v3
        with:
          packages: >-
            scheme-basic
            collection-fontsextra
            collection-xetex
            microtype
            upquote
            cm-super
            lmodern

      - name: Compile CV
        run: pdflatex -interaction=nonstopmode -halt-on-error SemihOnay-CV.tex

      - name: Verify PDF was produced
        run: |
          test -s SemihOnay-CV.pdf
          file SemihOnay-CV.pdf | grep -q 'PDF document'

      - name: Upload PDF artifact
        uses: actions/upload-artifact@v4
        with:
          name: cv-pdf
          path: SemihOnay-CV.pdf
          if-no-match-files: error

  release:
    name: Publish GitHub Release
    needs: build
    if: github.event_name == 'push' && github.ref_type == 'tag'
    runs-on: ubuntu-latest
    steps:
      - name: Download built PDF
        uses: actions/download-artifact@v4
        with:
          name: cv-pdf
          path: dist

      - name: Create / update release with PDF
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if ! gh release view "$TAG" --repo "$GH_REPO" >/dev/null 2>&1; then
            gh release create "$TAG" --title "Curriculum Vitae $TAG" --latest --repo "$GH_REPO"
          fi
          gh release upload "$TAG" dist/SemihOnay-CV.pdf --clobber --repo "$GH_REPO"
          gh release view "$TAG" --repo "$GH_REPO" --json tagName,assets --jq '{tag:.tagName,pdfs:[.assets[].name]}'
